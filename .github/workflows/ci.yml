# Comprueba que la rama compila. `npm run build` ya incluye `astro check`, asi
# que un error de tipos rompe el CI igual que rompe el build local.
#
# El despliegue NO se hace aqui: lo hace Cloudflare, conectado al repositorio.
# Ver DEPLOY.md.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` corre el postinstall que copia las fuentes a public/fonts.
      - run: npm ci

      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://wrailabs.com
