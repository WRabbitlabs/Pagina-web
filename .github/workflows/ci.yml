# Comprueba que la rama compila EN LAS CONDICIONES DEL DESPLIEGUE, no en las
# de un portátil.
#
# La diferencia importa y ya costó un despliegue: los constructores que definen
# NODE_ENV=production hacen que `npm ci` omita las devDependencies. Un build
# que pasa en local con todo instalado puede morir allí en el primer paso, sin
# que nadie lo vea venir. Por eso aquí se instala con `--omit=dev`.
#
# `main` no pasa por aquí: ahí manda deploy.yml, que hace lo mismo y además
# publica. Esto cubre las ramas de trabajo y los pull requests.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --omit=dev

      # Incluye `astro check`: un error de tipos no compila.
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://wrailabs.com

      # GitHub Pages sirve archivos y nada más. Si alguien vuelve a añadir una
      # ruta de servidor, el build deja un `dist/server/` y aquí se ve: allí
      # no se ejecutaría, y el fallo sería silencioso en producción.
      - name: La salida es estática
        run: |
          test ! -d dist/server
          test -f dist/index.html
          test -f dist/CNAME
          echo "archivos HTML: $(find dist -name '*.html' | wc -l)"
